# The same gate as local: typecheck + lint + vitest.
# The smoke suite (npm run test:smoke) needs a running local Supabase
# and stays manual.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
